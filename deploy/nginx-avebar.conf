# Ces zones doivent être déclarées dans le contexte http de Nginx. Sur Debian,
# ce fichier peut rester dans sites-available car les sites sont inclus depuis http {}.
limit_req_zone $binary_remote_addr zone=avebar_general:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=avebar_auth:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=avebar_connections:10m;
# Ne journalise jamais la chaîne de requête : les liens de validation contiennent un jeton à usage unique.
log_format avebar_safe '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name votre-domaine.fr www.votre-domaine.fr;
    return 301 https://votre-domaine.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votre-domaine.fr;
    server_tokens off;
    access_log /var/log/nginx/avebar-access.log avebar_safe;
    error_log /var/log/nginx/avebar-error.log warn;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    ssl_certificate /etc/letsencrypt/live/votre-domaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:AveBarTLS:10m;
    ssl_session_tickets off;
    ssl_ecdh_curve X25519:secp256r1;
    ssl_prefer_server_ciphers off;

    # Compression au niveau du reverse proxy : Node garde ses ressources pour
    # le rendu et la BDD. Les flux SSE restent explicitement non compressés.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    client_max_body_size 6m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 20s;
    send_timeout 30s;
    large_client_header_buffers 4 8k;
    max_ranges 1;
    limit_conn avebar_connections 30;
    limit_req zone=avebar_general burst=80 nodelay;
    limit_req_status 429;

    # Aucun fichier caché (configuration, dépôt, sauvegarde) ne doit être servi.
    location ~ /\.(?!well-known(?:/|$)) {
        deny all;
    }

    location ~ ^/(connexion|inscription|admin/connexion)$ {
        limit_req zone=avebar_auth burst=8 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/avebar-proxy.conf;
    }

    location ^~ /flux/ {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/avebar-proxy.conf;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 35m;
        gzip off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/avebar-proxy.conf;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.votre-domaine.fr;
    ssl_certificate /etc/letsencrypt/live/votre-domaine.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votre-domaine.fr/privkey.pem;
    return 301 https://votre-domaine.fr$request_uri;
}
